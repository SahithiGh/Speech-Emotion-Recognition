<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFEFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050400" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>Speech Emotion Recognition</title>
    <meta name="description" content="Analyze a voice recording and see which of six emotions it most resembles. A machine learning project trained on the CREMA-D dataset." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Speech Emotion Recognition" />
    <meta property="og:description" content="Analyze a voice recording and see which of six emotions it most resembles." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved or system theme before the page paints, to avoid a flash of the wrong theme.
      (function () {
        var t = null;
        try { t = localStorage.getItem("ser-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript to record and analyze audio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
